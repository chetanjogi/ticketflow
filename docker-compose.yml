services:
  postgres:
    image: postgres:16
    container_name: ticketflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      -  postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticketflow-redis
    ports:
      - "6379:6379"

volumes:
    postgres-data: